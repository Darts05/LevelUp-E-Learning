<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LevelUp</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <img src="../assets/LevelUp-Logo.png" alt="LevelUp Logo" class="login-logo">
                <h1>Join LevelUp</h1>
                <p>Start your journey today and track your progress.</p>
            </div>
        </div>

        <div class="login-form-section">
            <form class="login-form" id="signupForm">
                <h2>Create Account</h2>
                
                <div class="input-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">Register</button>
                <p class="signup-text">Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>

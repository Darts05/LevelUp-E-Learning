<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LevelUp</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <img src="../assets/LevelUp-Logo.png" alt="LevelUp-Logo" class="login-logo">
                <h1>LevelUp</h1>
                <p>Knowledge is the only tool that grows when shared. Ready for your next quiz?</p>
            </div>
        </div>

        <div class="login-form-section">
    <form class="login-form" id="loginForm" action="../login_action.php" method="POST">
        <h2>Welcome Back</h2>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="input-group password-container">
            <label for="password">Password</label>
            <div class="password-wrapper" style="position: relative; display: flex; align-items: center;">
                <input type="password" name="password" id="password" placeholder="••••••••" required style="flex: 1;">
                <span id="togglePassword" style="position: absolute; right: 10px; cursor: pointer;">👁️</span>
            </div>
        </div>

        <button type="submit" class="login-btn">Sign In</button>
        <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
</div>
    </div>
</body>
</html>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        // Toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // Toggle the eye icon
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>

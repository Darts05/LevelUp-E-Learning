<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LevelUp</title>
    <link rel="stylesheet" href="../css/style.css?v=1.1">
</head>
<body>
    <div class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <img src="../assets/LevelUp-Logo.png" alt="LevelUp-Logo" class="login-logo">
                <h1>LevelUp</h1>
                <p>Knowledge is the only tool that grows when shared. Ready for your next quiz?</p>
            </div>
        </div>

        <div class="login-form-section">
            <form class="login-form">
                <h2>Welcome Back</h2>
                <p class="subtitle">Please enter your details to continue.</p>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>

                <p class="signup-text">Don't have an account? <a href="#">Create one for free</a></p>
            </header>
        </div>
    </div>
</body>
</html>
